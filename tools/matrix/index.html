
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>精确矩阵实验室 | Dezhonger Tools</title>
    <meta name="description" content="精确计算矩阵行列式、秩、迹、逆、RREF、特征值、特征向量与多种矩阵分解。">
    <link rel="stylesheet" href="/assets/tools/code-tools.css?v=20260810a">
    <link rel="stylesheet" href="/assets/tools/math-tools.css?v=20260810a">
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
        options: { processHtmlClass: 'mathjax-process', ignoreHtmlClass: 'tex2jax_ignore' }
      }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.0/es5/tex-mml-chtml.js" integrity="sha256-r+3itOMtGGjap0x+10hu6jW/gZCzxHsoKrOd7gyRSGY=" crossorigin="anonymous"></script>
    <script defer src="/assets/tools/exact-math-core.js?v=20260810a"></script>
    <script defer src="/assets/tools/exact-matrix.js?v=20260810a"></script>
    <script defer src="/assets/tools/equation-solver.js?v=20260810a"></script>
    <script defer src="/assets/tools/matrix-tool.js?v=20260810a"></script>
  </head>
  <body class="tool-body math-page">
    <main class="tool-shell">
      <header class="tool-topbar">
        <a class="tool-brand" href="/">Dezhonger</a>
        <nav class="tool-nav" aria-label="Primary navigation">
          <a href="/blog/">Blog</a><a href="/game/">Game</a><a href="/about/">About</a>
          <a href="/tools/" class="active">Tools</a><a href="/tags/">Tags</a><a href="/archives/">Archives</a>
        </nav>
      </header>

      <section class="tool-hero">
        <div>
          <p class="tool-eyebrow">Exact Mathematics · Linear Algebra</p>
          <h1>精确矩阵实验室</h1>
          <p>从输入到消元全部使用自动约分的有理数。特征值保留为根式或特征多项式的根，QR 中的平方根也保持符号形式。</p>
        </div>
        <div class="hero-actions">
          <a class="tool-link-btn primary" href="/tools/number-theory/">数论计算</a>
          <a class="tool-link-btn secondary" href="/tools/">返回 Tools</a>
        </div>
      </section>

      <section class="tool-panel">
        <div class="panel-head"><h2>矩阵输入与计算</h2><div class="panel-note">空格或逗号分列，换行或分号分行；最大 10 × 10</div></div>
        <div class="matrix-workspace">
          <div class="matrix-controls math-form">
            <label class="math-field-block">
              <span class="matrix-label">矩阵 A</span>
              <textarea id="matrix-input" class="matrix-input" spellcheck="false">4 2 2
2 5 1
2 1 3</textarea>
            </label>
            <div class="math-actions">
              <button id="matrix-analyze-btn" class="tool-btn primary" type="button">完整分析</button>
              <button id="matrix-example-btn" class="tool-btn secondary" type="button">对称矩阵示例</button>
              <button id="matrix-clear-btn" class="tool-btn secondary" type="button">清空</button>
            </div>
            <div class="precision-note"><strong>完整分析包含：</strong>维度、秩、转置、RREF、零空间、列空间；方阵额外计算行列式、迹、逆矩阵、特征多项式、特征值和特征向量/特征空间。</div>
            <label class="math-field-block"><span>矩阵分解</span>
              <select id="matrix-decomposition" class="math-select">
                <option value="plu">PLU（带行置换）</option>
                <option value="ldu">LDU（单位三角）</option>
                <option value="ldlt">LDLᵀ（对称矩阵）</option>
                <option value="qr">QR（满列秩）</option>
                <option value="svd">SVD（精确谱表示）</option>
              </select>
            </label>
            <div class="math-actions"><button id="matrix-decompose-btn" class="tool-btn primary" type="button">执行分解</button></div>
            <div id="matrix-status" class="math-status" aria-live="polite" hidden></div>
          </div>
          <div id="matrix-output" class="math-output-grid matrix-output"></div>
        </div>
      </section>
    </main>
  </body>
</html>
